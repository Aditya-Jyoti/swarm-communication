# Builds the VitePress curriculum and deploys it to GitHub Pages.
#
# The two check steps run before the build on purpose. A non-ASCII character or a
# malformed Mermaid diagram does not fail a VitePress build -- diagrams render in the
# browser, so a broken one ships silently and is only discovered by a reader. These
# gates turn both classes of defect into a red pipeline instead.
name: Deploy Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated timestamps need real history

      # Node 22, not 20: jsdom 30 (used by the Mermaid check) pulls in undici 8,
      # which calls webidl APIs Node 20 does not have and crashes at import.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check strict ASCII (CLAUDE.md 4.1)
        run: npm run docs:check:ascii

      - name: Check Mermaid diagrams parse (CLAUDE.md 4.2)
        run: npm run docs:check:mermaid

      - name: Build VitePress
        run: npm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
