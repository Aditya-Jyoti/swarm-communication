# Builds the VitePress curriculum and deploys it to GitHub Pages.
#
# The two check steps run before the build on purpose. A non-ASCII character or a
# malformed Mermaid diagram does not fail a VitePress build -- diagrams render in the
# browser, so a broken one ships silently and is only discovered by a reader. These
# gates turn both classes of defect into a red pipeline instead.
name: Deploy Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Least privilege: read-only by default. Only the deploy job, which runs no
# repository code, gets the Pages and OIDC token scopes; the build job runs
# npm packages and must not hold them.
permissions:
  contents: read

# Allow one concurrent deployment; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # lastUpdated timestamps need real history
          persist-credentials: false # nothing here pushes

      # Node 22, not 20: jsdom 30 (used by the Mermaid check) pulls in undici 8,
      # which calls webidl APIs Node 20 does not have and crashes at import.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # The docs site is its own npm project; every npm step runs inside docs/.
      - run: npm ci
        working-directory: docs

      - name: Check strict ASCII (.claude/CLAUDE.md 4.1)
        run: npm run check:ascii
        working-directory: docs

      - name: Check Mermaid diagrams parse (.claude/CLAUDE.md 4.2)
        run: npm run check:mermaid
        working-directory: docs

      - name: Build VitePress
        run: npm run build
        working-directory: docs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
