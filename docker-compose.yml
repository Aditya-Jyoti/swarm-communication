# swarm-net local environment.
#
#   cp .env.example .env                        # optional: every variable has a default
#   docker compose up -d --build                # control center + seed + 5 nodes + dashboard
#   docker compose up -d --scale node=11        # any N; no Go or YAML edits
#   open http://127.0.0.1:8080                  # ${BIND_ADDR}:${FRONTEND_PORT}
#
# Services:
#   control-center  backend/ image, target control-center. NOT published: the
#                   browser reaches it only through `frontend`.
#   seed, node      backend/ image, target node. `node` is the scalable one.
#   frontend        frontend/ image: nginx serving the dashboard and
#                   proxying /api/, /healthz and /ws to control-center:8080.
#
# Tunables come from .env (Compose reads it for ${...} interpolation). Every
# variable has a default here, so the file also works with no .env at all.
# See .env.example for the full, commented list.
#
# Topology: every container sits on the user-defined bridge `swarmnet`, where
# Docker's embedded DNS resolves service names (`seed`, `control-center`),
# container names (`swarm-net-node-3`) and container short IDs.
#
# Identity under --scale: replicas of `node` share one definition, so their
# SWARM_NODE_ID / SWARM_ADVERTISE cannot be written here. The image entrypoint
# (backend/deploy/node-entrypoint.sh) reverse-resolves its own IP to the
# container name and uses that for both. `seed` sets them explicitly because
# every other node needs a fixed address to dial first.
#
# Security: the published port binds to ${BIND_ADDR:-127.0.0.1}. The HTTP API
# (tasks, chaos, sim) needs no credentials by default. SWARM_CC_API_TOKEN turns on a
# bearer token at the control center; the frontend's nginx adds it to /api/
# and /ws server-side, so the dashboard keeps working and the browser never
# sees it. That shuts out callers that bypass nginx (any other container on
# the bridge, or a published CC port), NOT people who can reach the
# dashboard: set BIND_ADDR=0.0.0.0 only on a trusted network either way.
# Threat model: backend/pkg/controlcenter/auth.go.
name: swarm-net

x-hardening: &hardening
  # Nothing here needs a Linux capability: every port is above 1024 and chaos
  # latency is injected in-process (SetChaosDelay), not with tc/netem.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-backend-build: &backend-build
  context: ./backend
  args:
    VERSION: "${SWARM_VERSION:-dev}"
    GO_VERSION: "${GO_VERSION:-1.27}"
    ALPINE_VERSION: "${ALPINE_VERSION:-3.24}"

x-node-env: &node-env
  SWARM_LISTEN: ":7000"
  SWARM_SEEDS: "seed:7000"
  SWARM_CONTROL_CENTER: "control-center:7000"
  # LeaderCount = max(1, ceil(N * threshold)); 0.3 gives 2 leaders at N=6, so
  # killing one still leaves a leader while re-election runs.
  SWARM_THRESHOLD: "${SWARM_THRESHOLD:-0.3}"
  SWARM_PROBE_INTERVAL: "${SWARM_PROBE_INTERVAL:-1s}"
  SWARM_IDLE_TIMEOUT: "${SWARM_IDLE_TIMEOUT:-5s}"
  SWARM_GOSSIP_INTERVAL: "${SWARM_GOSSIP_INTERVAL:-2s}"
  SWARM_ELECTION_FLOOR: "${SWARM_ELECTION_FLOOR:-30s}"
  SWARM_TELEMETRY_INTERVAL: "${SWARM_TELEMETRY_INTERVAL:-1s}"
  SWARM_LOG_LEVEL: "${SWARM_LOG_LEVEL:-info}"

x-node: &node
  <<: *hardening
  build:
    <<: *backend-build
    target: node
  image: "swarm-net/node:${SWARM_IMAGE_TAG:-dev}"
  networks: [swarmnet]
  read_only: true
  # on-failure, on purpose: a CHAOS "kill" makes the node exit with code 0,
  # so the killed node stays dead and the failover stays visible on the
  # dashboard (shown as "killed"), while a real crash (non-zero exit) is
  # still restarted. Docker never restarts a container the operator stopped
  # (`docker stop` / `docker kill`), under any policy. To bring killed nodes
  # back, run `docker compose up -d` again.
  restart: on-failure
  # SIGTERM triggers a graceful LEAVE; 3s is plenty and keeps `down` fast.
  stop_grace_period: 3s
  depends_on:
    control-center:
      condition: service_started

services:
  control-center:
    <<: *hardening
    build:
      <<: *backend-build
      target: control-center
    image: "swarm-net/control-center:${SWARM_IMAGE_TAG:-dev}"
    hostname: control-center
    networks: [swarmnet]
    read_only: true
    environment:
      SWARM_LOG_LEVEL: "${SWARM_LOG_LEVEL:-info}"
      # Empty = no auth. See the Security note at the top of this file.
      SWARM_CC_API_TOKEN: "${SWARM_CC_API_TOKEN:-}"
      # Latency simulation: emulated latency from 3D distance
      # (docs/architecture/latency-simulation.md). Start-up values only; the
      # dashboard's advanced panel changes them at run time.
      #   delay = base + distance * per_unit + jitter * U[0,1)
      SWARM_SIM_ENABLED: "${SWARM_SIM_ENABLED:-true}"
      SWARM_SIM_BASE_MS: "${SWARM_SIM_BASE_MS:-1}"
      SWARM_SIM_PER_UNIT_MS: "${SWARM_SIM_PER_UNIT_MS:-2}"
      SWARM_SIM_JITTER_MS: "${SWARM_SIM_JITTER_MS:-0.5}"
    # Not published by default: the dashboard and API are reached through
    # `frontend`. To expose the CC directly (e.g. to bypass nginx while
    # debugging), uncomment these two lines and set CC_HTTP_PORT in .env:
    # ports:
    #   - "${BIND_ADDR:-127.0.0.1}:${CC_HTTP_PORT:-18081}:8080"
    restart: unless-stopped
    # The CC gives in-flight HTTP requests 5s to finish on SIGTERM
    # (backend/cmd/control-center/main.go); a shorter grace period would
    # SIGKILL it first.
    stop_grace_period: 10s

  seed:
    <<: *node
    hostname: seed
    environment:
      <<: *node-env
      SWARM_NODE_ID: seed
      SWARM_ADVERTISE: "seed:7000"
      # parseSeeds drops our own address, so the shared SWARM_SEEDS is harmless.

  node:
    <<: *node
    environment:
      <<: *node-env
    # Default N = seed + NODE_REPLICAS. `--scale node=N` overrides this.
    deploy:
      replicas: ${NODE_REPLICAS:-5}
    depends_on:
      control-center:
        condition: service_started
      seed:
        condition: service_started

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31-alpine}"
    image: "swarm-net/frontend:${SWARM_IMAGE_TAG:-dev}"
    networks: [swarmnet]
    environment:
      CONTROL_CENTER_UPSTREAM: "control-center:8080"
      # Same value as the CC's; nginx injects it (nginx.conf.template).
      CC_API_TOKEN: "${SWARM_CC_API_TOKEN:-}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    # No depends_on on purpose: nginx resolves control-center per request, so
    # it starts on its own and keeps serving the dashboard (which shows
    # "reconnecting") while the CC is down or being recreated.
    read_only: true
    # The only paths nginx writes: temp/cache dirs, the pid file, and the
    # config rendered from the template at start-up. Owned by nginx (uid 101).
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    restart: unless-stopped
    # nginx stops on SIGTERM at once; keep `down` fast.
    stop_grace_period: 3s

networks:
  # Compose names it "<project>_swarmnet". No fixed `name:` on purpose: a fixed
  # name would make two projects (a dev stack and scripts/e2e.sh, which uses its
  # own project) fight over one network.
  swarmnet:
    driver: bridge
