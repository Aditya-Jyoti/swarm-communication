# swarm-net local environment.
#
#   docker compose up --build                  # control center + seed + 5 nodes = 6 nodes
#   docker compose up --build --scale node=11  # any N; no Go or YAML edits
#   open http://localhost:8080
#
# Topology: every container sits on the user-defined bridge `swarmnet`, where
# Docker's embedded DNS resolves service names (`seed`, `control-center`),
# container names (`swarm-net-node-3`) and container short IDs.
#
# Identity under --scale: replicas of `node` share one definition, so their
# SWARM_NODE_ID / SWARM_ADVERTISE cannot be written here. The image entrypoint
# (deploy/node-entrypoint.sh) reverse-resolves its own IP to the container name
# and uses that for both. `seed` sets them explicitly because every other node
# needs a fixed address to dial first.
name: swarm-net

x-node-env: &node-env
  SWARM_LISTEN: ":7000"
  SWARM_SEEDS: "seed:7000"
  SWARM_CONTROL_CENTER: "control-center:7000"
  # LeaderCount = max(1, ceil(N * threshold)); the code default 0.3 gives 2
  # leaders at N=6, so killing one still leaves a leader while re-election runs.
  SWARM_THRESHOLD: "${SWARM_THRESHOLD:-0.3}"
  SWARM_PROBE_INTERVAL: "${SWARM_PROBE_INTERVAL:-1s}"
  SWARM_IDLE_TIMEOUT: "${SWARM_IDLE_TIMEOUT:-5s}"
  SWARM_GOSSIP_INTERVAL: "${SWARM_GOSSIP_INTERVAL:-2s}"
  SWARM_TELEMETRY_INTERVAL: "${SWARM_TELEMETRY_INTERVAL:-1s}"
  SWARM_LOG_LEVEL: "${SWARM_LOG_LEVEL:-info}"

x-node: &node
  build:
    context: .
    target: node
  image: swarm-net/node:dev
  networks: [swarmnet]
  # A CHAOS "kill" makes the node exit(1); `unless-stopped` brings it back as a
  # new incarnation, so the dashboard shows death -> failover -> rejoin. It
  # deliberately does NOT restart a container the operator stopped (`docker
  # stop` / `docker kill` from the e2e script), so a manual kill stays dead and
  # the failover is observable rather than papered over by an instant restart.
  restart: unless-stopped
  # SIGTERM triggers a graceful LEAVE; 3s is plenty and keeps `down` fast.
  stop_grace_period: 3s
  depends_on:
    control-center:
      condition: service_started

services:
  control-center:
    build:
      context: .
      target: control-center
    image: swarm-net/control-center:dev
    hostname: control-center
    networks: [swarmnet]
    ports:
      - "${SWARM_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 3s

  seed:
    <<: *node
    hostname: seed
    environment:
      <<: *node-env
      SWARM_NODE_ID: seed
      SWARM_ADVERTISE: "seed:7000"
      # parseSeeds drops our own address, so the shared SWARM_SEEDS is harmless.

  node:
    <<: *node
    environment:
      <<: *node-env
    # Default N: seed + 5 = 6 nodes. Override with --scale node=N.
    deploy:
      replicas: 5
    depends_on:
      control-center:
        condition: service_started
      seed:
        condition: service_started

networks:
  swarmnet:
    name: swarmnet
    driver: bridge
